name: Installeur Windows

# Le seul workflow utile au quotidien : il produit le .exe et le .msi.
#
# Deux façons de le lancer :
#   • onglet Actions → « Installeur Windows » → « Run workflow »
#   • pousser un tag de version :  git tag v1.0.0 && git push origin v1.0.0
#     (crée en plus une release brouillon avec les installeurs attachés)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # Les vérifications tournent à part et NE bloquent PAS la fabrication :
  # un test rouge doit se voir, mais ne doit pas vous priver de l'installeur.
  verifier:
    name: Vérifications
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Typage
        run: npm run check

      - name: Tests de la logique de jeu
        run: npm test

      - name: Tests Rust
        run: npm run test:rust

  windows:
    name: Fabrication
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Labo Kessler ${{ github.ref_name }}'
          releaseBody: "Installeur Windows non signé : SmartScreen affichera un avertissement au premier lancement (Informations complémentaires → Exécuter quand même)."
          releaseDraft: true
          prerelease: false

      # De quoi vérifier que le fichier téléchargé est bien celui que GitHub a
      # produit à partir de ce dépôt : comparez l'empreinte affichée ici avec
      # `Get-FileHash .\\labo-kessler_1.0.0_x64-setup.exe` chez vous.
      - name: Empreintes SHA-256
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Include *.exe,*.msi |
            ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              Write-Host "$h  $($_.Name)"
            }

      # lancement manuel : l'installeur se télécharge depuis la page du run
      - name: Publier l'installeur
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: labo-kessler-windows
          retention-days: 30
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
