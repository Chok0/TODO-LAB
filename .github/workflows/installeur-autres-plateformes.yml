name: Installeurs macOS et Linux

# Gardé au cas où, mais **jamais déclenché automatiquement** : ni sur tag, ni
# sur push. Il ne tourne que si vous cliquez « Run workflow ».
#
# Si vous êtes certain de ne jamais en avoir besoin, supprimez ce fichier :
# le workflow Windows est totalement indépendant.

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            nom: macos-apple-silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            nom: macos-intel
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            nom: linux
            args: ''

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.nom }}

    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux uniquement)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Publier les installeurs
        uses: actions/upload-artifact@v4
        with:
          name: labo-kessler-${{ matrix.nom }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
