name: Installeurs

# Fabrique les installeurs sur les trois systèmes. Tauri ne sait pas
# compiler pour Windows depuis Linux : chaque plateforme se construit
# sur sa propre machine, c'est GitHub qui les fournit.
#
# Deux façons de lancer :
#   • onglet Actions → « Installeurs » → « Run workflow » (bouton)
#   • pousser un tag de version :  git tag v1.0.0 && git push origin v1.0.0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            nom: windows
          - platform: macos-latest
            nom: macos-apple-silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            nom: macos-intel
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            nom: linux

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.nom }}

    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux uniquement)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # les tests tournent une seule fois, pas sur les quatre machines
      - name: Vérifications
        if: matrix.nom == 'linux'
        run: |
          npm run check
          npm test
          npm run test:rust

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # sur un tag : crée une release brouillon avec les installeurs attachés
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Labo Kessler ${{ github.ref_name }}'
          releaseBody: "Installeurs générés automatiquement. Voir docs/qa-v1.md pour l'état de recette."
          releaseDraft: true
          prerelease: false

      # lancement manuel : les installeurs sont téléchargeables depuis la page du run
      - name: Publier les installeurs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: labo-kessler-${{ matrix.nom }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
