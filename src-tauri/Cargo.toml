[package]
name = "labo-kessler"
version = "1.0.0"
description = "Labo Kessler — todo list gamifiée en widget desktop"
authors = ["Labo Kessler"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "labo_kessler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
